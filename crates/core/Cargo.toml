[package]
name = "openjarvisbr-core"
version = "0.3.1"
edition = "2021"

[dependencies]
async-trait.workspace = true
base64.workspace = true
cpal.workspace = true
futures-util.workspace = true
hound.workspace = true
keyring.workspace = true
reqwest.workspace = true
ringbuf.workspace = true
rubato.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
tracing.workspace = true

# AEC3 do WebRTC só no macOS: o build C++ (meson/ninja/clang) não existe no
# CI Windows; lá `audio::aec` usa um NLMS próprio.
[target.'cfg(target_os = "macos")'.dependencies]
webrtc-audio-processing = { version = "2.1.0", features = ["bundled"] }
webrtc-audio-processing-config = "2.1.0"

[dev-dependencies]
tracing-subscriber.workspace = true
