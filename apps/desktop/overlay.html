<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenJarvisBR — Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Paleta — docs/design/referencias.md § Recomendação Final */
        :root {
            --color-bg: #0c0c0c;
            --color-primary: #7c3aed;
            --color-accent: #06b6d4;
            --color-coral: #ff6363;
            --color-text: #e0e0e0;
            --color-text-dim: #8a8a92;
            --glow-primary: rgba(124, 58, 237, 0.3);

            --appear-duration: 250ms;
            --appear-ease: ease-out;
            --disappear-duration: 200ms;
            --disappear-ease: ease-in;
        }

        .overlay-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            gap: 6px;
            visibility: hidden;
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
            transition:
                opacity var(--disappear-duration) var(--disappear-ease),
                transform var(--disappear-duration) var(--disappear-ease),
                visibility 0s linear var(--disappear-duration);
        }

        .overlay-container.visible {
            visibility: visible;
            opacity: 1;
            transform: scale(1);
            transition:
                opacity var(--appear-duration) var(--appear-ease),
                transform var(--appear-duration) var(--appear-ease),
                visibility 0s;
        }

        .overlay-card {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            padding: 0 22px;
            background: var(--color-bg);
            border: 1px solid rgba(124, 58, 237, 0.25);
            border-radius: 22px;
            box-shadow: 0 0 24px var(--glow-primary), 0 8px 24px rgba(0, 0, 0, 0.45);
            transition: border-color 200ms ease-in-out;
        }

        .overlay-container.muted .overlay-card,
        .overlay-container.error .overlay-card {
            border-color: var(--color-coral);
        }

        /* Orb de 7 pontos — docs/design/prototipos.html (Perplexity Voice Orb) */
        .orb-wrap {
            position: relative;
            width: 56px;
            height: 56px;
            flex: 0 0 auto;
            filter: drop-shadow(0 0 12px var(--glow-primary));
        }

        .orb {
            width: 100%;
            height: 100%;
        }

        .orb-dots {
            transform-box: fill-box;
            transform-origin: center;
            transform: scale(calc(1 + var(--mic-level, 0) * 0.35));
            transition: transform 80ms linear;
        }

        .orb-dot {
            transform-box: fill-box;
            transform-origin: center;
            animation: orb-breathe 1.1s ease-in-out infinite;
        }

        .orb-dot.primary { fill: var(--color-primary); }
        .orb-dot.accent { fill: var(--color-accent); }

        .orb-dot:nth-child(1) { animation-delay: 0s; }
        .orb-dot:nth-child(2) { animation-delay: .15s; }
        .orb-dot:nth-child(3) { animation-delay: .3s; }
        .orb-dot:nth-child(4) { animation-delay: .45s; }
        .orb-dot:nth-child(5) { animation-delay: .6s; }
        .orb-dot:nth-child(6) { animation-delay: .75s; }
        .orb-dot:nth-child(7) { animation-delay: .9s; }

        @keyframes orb-breathe {
            0%, 100% { r: 4; opacity: .55; }
            50% { r: 5.5; opacity: 1; }
        }

        .orb-core {
            fill: var(--color-primary);
            opacity: .9;
        }

        .overlay-container.speaking .orb-dots {
            transform: scale(calc(1.15 + var(--model-level, 0) * 0.35));
        }

        .overlay-container.speaking .orb-dot {
            animation-duration: .55s;
        }

        .overlay-container.muted .orb-wrap {
            filter: saturate(0.2);
        }

        /* Cena 3D surreal — docs/design/openjarvisbr-surreal.html, via src/overlay/surreal.ts */
        .surreal-wrap {
            position: relative;
            width: 168px;
            height: 168px;
            flex: 0 0 auto;
        }

        .surreal-wrap canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .state-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--color-text-dim);
            box-shadow: 0 0 6px currentColor;
            transition: background 150ms ease-in-out;
        }

        .overlay-container.listening .state-dot { background: var(--color-accent); }
        .overlay-container.speaking .state-dot { background: var(--color-primary); }
        .overlay-container.muted .state-dot,
        .overlay-container.error .state-dot { background: var(--color-coral); }

        /* Selo "acesso total" (JRV-65): discreto, só enquanto o modo está ligado. */
        .overlay-card { position: relative; }
        .full-access-badge {
            position: absolute;
            top: 6px;
            right: 12px;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--color-coral);
            opacity: 0.75;
            pointer-events: none;
        }
        .full-access-badge[hidden] { display: none; }

        /* Última fala do usuário e do modelo, uma linha cada, com elipse */
        .lines {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            min-width: 0;
            flex: 1 1 auto;
        }

        .line {
            font-size: 12px;
            font-weight: 500;
            line-height: 1.4;
            color: var(--color-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            transition: opacity 150ms ease-in-out;
        }

        .line.has-text {
            opacity: 1;
        }

        .line .label {
            color: var(--color-text-dim);
            margin-right: 4px;
        }

        .line-model.tone-error,
        .line-model.tone-error .label {
            color: var(--color-coral);
        }

        /* Faixa de ferramenta (JRV-58) — src/overlay/tools.ts. A janela cresce
           52px + gap quando ela aparece (set_overlay_tool_strip). */
        .tool-strip {
            display: none;
            flex: 0 0 52px;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            background: var(--color-bg);
            border: 1px solid rgba(6, 182, 212, 0.35);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .overlay-container.tool-active .tool-strip {
            display: flex;
        }

        .tool-strip[data-tone="ok"] { border-color: rgba(52, 211, 153, 0.5); }
        .tool-strip[data-tone="fail"] { border-color: var(--color-coral); }
        .tool-strip[data-tone="reflex"] { border-color: rgba(250, 204, 21, 0.6); }

        .tool-text {
            flex: 1 1 auto;
            min-width: 0;
            font-size: 12px;
            font-weight: 500;
            color: var(--color-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tool-strip[data-mode="running"] .tool-text { color: var(--color-text-dim); }
        .tool-strip[data-tone="ok"] .tool-text { color: #34d399; }
        .tool-strip[data-tone="fail"] .tool-text { color: var(--color-coral); }
        .tool-strip[data-tone="reflex"] .tool-text { color: #facc15; }

        .tool-strip button {
            flex: 0 0 auto;
            pointer-events: auto;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
            background: #161616;
            color: var(--color-text);
            cursor: pointer;
        }

        .tool-strip button[hidden] { display: none; }

        .tool-strip #tool-confirm {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: #fff;
        }

        .tool-strip button:hover { filter: brightness(1.15); }
    </style>
</head>
<body>
    <div id="app" class="overlay-container">
        <div class="overlay-card">
            <span id="full-access-badge" class="full-access-badge" hidden>acesso total</span>
            <div id="surreal-wrap" class="surreal-wrap" hidden></div>
            <div id="orb-wrap" class="orb-wrap">
                <svg class="orb" viewBox="0 0 100 100" aria-hidden="true">
                    <g class="orb-dots">
                        <circle class="orb-dot primary" cx="50" cy="10" r="4"></circle>
                        <circle class="orb-dot accent" cx="72" cy="20" r="4"></circle>
                        <circle class="orb-dot primary" cx="78" cy="45" r="4"></circle>
                        <circle class="orb-dot accent" cx="72" cy="70" r="4"></circle>
                        <circle class="orb-dot primary" cx="50" cy="80" r="4"></circle>
                        <circle class="orb-dot accent" cx="28" cy="70" r="4"></circle>
                        <circle class="orb-dot primary" cx="22" cy="45" r="4"></circle>
                    </g>
                    <circle class="orb-core" cx="50" cy="50" r="9"></circle>
                </svg>
                <span id="state-dot" class="state-dot"></span>
            </div>
            <div class="lines">
                <div id="user-line" class="line line-user"><span class="label">Você</span><span class="text"></span></div>
                <div id="model-line" class="line line-model"><span class="label">Jarvis</span><span class="text"></span></div>
            </div>
        </div>
        <div id="tool-strip" class="tool-strip" data-mode="idle" aria-live="polite">
            <span class="tool-text"></span>
            <button type="button" id="tool-confirm" hidden>Confirmar</button>
            <button type="button" id="tool-deny" hidden>Negar</button>
        </div>
    </div>
    <script type="module" src="/src/overlay/overlay.ts"></script>
</body>
</html>
